<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102b91">
  <title>SkillMesh — Find Your People</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" data-page="dashboard">
        <span class="brand-mark"><i></i><i></i><i></i></span>
        <span>skill<span class="brand-light">mesh</span><small>BUILD BETTER TOGETHER</small></span>
      </a>
      <div class="workspace-label">WORKSPACE</div>
      <nav class="nav-list">
        <button class="nav-item active" data-page="dashboard"><span>⌂</span> Overview</button>
        <button class="nav-item" data-page="discover"><span>⌕</span> Discover talent</button>
        <button class="nav-item" data-page="matches"><span>✳</span> Team matches <b class="nav-count" id="matchCount">4</b></button>
        <button class="nav-item" data-page="teams"><span>◇</span> My teams</button>
        <button class="nav-item" data-page="messages"><span>☏</span> Messages <b class="nav-count muted-count" id="messageCount">2</b></button>
      </nav>
      <div class="workspace-label space-top">YOUR GROWTH</div>
      <nav class="nav-list">
        <button class="nav-item" data-page="skills"><span>◎</span> Skill graph</button>
        <button class="nav-item" data-page="calendar"><span>▦</span> Availability</button>
        <button class="nav-item" data-page="portfolio"><span>↗</span> Portfolio studio</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="help-card"><span class="help-spark">✳</span><strong>Make your next move.</strong><p>Your next great project could start with one connection.</p><button data-page="matches">Find my people ↗</button></div>
        <a href="auth/index.html" class="auth-nav-link"><span>↗</span><span>Sign In / Sign Up</span></a>
        <button class="profile-mini" data-page="profile"><span class="avatar avatar-you">N</span><span><strong id="sideName">Nandini</strong><small>Member profile</small></span><span class="dots">•••</span></button>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button>
        <div class="crumb">Workspace <span>/</span> <strong id="pageCrumb">Overview</strong></div>
        <div class="top-actions"><span class="live-dot"></span><span class="online-label">You’re online</span><button class="icon-button" id="notificationBtn" title="Notifications">♧<i></i></button><button class="top-avatar" data-page="profile">N</button></div>
      </header>
      <div id="pageContent" class="page-content"></div>
      <footer>SKILLMESH © 2026 <span>MADE FOR PEOPLE WHO BUILD.</span></footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <div class="modal-backdrop" id="modalBackdrop"><section class="modal" id="modal" role="dialog" aria-modal="true"></section></div>
  <!-- JavaScript modules are loaded in dependency order. -->
  <script src="js/data/seed.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/state.js"></script>
  <script src="js/utils/helpers.js"></script>
  <script src="js/pages/shared.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/discover.js"></script>
  <script src="js/pages/matches.js"></script>
  <script src="js/pages/teams.js"></script>
  <script src="js/pages/messages.js"></script>
  <script src="js/pages/skills.js"></script>
  <script src="js/pages/calendar.js"></script>
  <script src="js/pages/portfolio.js"></script>
  <script src="js/pages/profile.js"></script>
  <script src="js/controllers/navigation.js"></script>
  <script src="js/controllers/actions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
